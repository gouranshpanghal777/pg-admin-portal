name: Apply electricity billing UI patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply electricity billing UI patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic patch
        run: python3 scripts/apply-electricity-billing-ui.py
      - name: Install
        run: npm ci
      - name: Self test
        run: npm run self-test
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff check
        run: git diff --check
      - name: Commit verified patch
        run: |
          rm -f scripts/apply-electricity-billing-ui.py .github/workflows/apply-electricity-billing-ui.yml
          git config user.name "pg95-bot"
          git config user.email "pg95-bot@users.noreply.github.com"
          git add -A
          git commit -m "Add recurring electricity billing controls and WhatsApp totals"
          git push origin HEAD:main
