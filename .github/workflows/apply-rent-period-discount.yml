name: Apply rent-period discount UI

on:
  push:
    branches:
      - feature/rent-period-discount

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: stage rent period discount UI' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Repair prior deterministic patch guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-electricity-billing-ui.py')
          text = p.read_text()
          old = "    if count != 1:\n        raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')"
          new = "    if count < 1:\n        raise SystemExit(f'{path}: expected at least one match, found {count}: {old[:120]!r}')"
          if old not in text:
              raise SystemExit('electricity patch guard not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply pending electricity UI patch
        run: python3 scripts/apply-electricity-billing-ui.py
      - name: Apply rent discount UI patch
        run: python3 scripts/apply-rent-discount-ui.py
      - name: Install
        run: npm ci
      - name: Self test
        run: npm run self-test
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff check
        run: git diff --check
      - name: Commit verified feature
        shell: bash
        run: |
          rm -f scripts/apply-electricity-billing-ui.py .github/workflows/apply-electricity-billing-ui.yml
          rm -f scripts/apply-rent-discount-ui.py .github/workflows/apply-rent-period-discount.yml
          git config user.name pg95-bot
          git config user.email pg95-bot@users.noreply.github.com
          git add -A
          git commit -m "Add period-specific rent discounts and billing controls"
          git push origin HEAD:feature/rent-period-discount
