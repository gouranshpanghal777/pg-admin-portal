name: Apply tenant pending and upcoming rules

on:
  push:
    branches: [feat/tenant-upcoming-month-pending]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tenant-upcoming-month-pending
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply deterministic patch
        run: python scripts/apply-tenant-upcoming-month-pending.py
      - name: Verify UI and helper markers
        run: |
          grep -F "'Upcoming Rent'" src/App.tsx
          grep -F "isRentPendingInCurrentMonth" src/App.tsx
          grep -F "isRentUpcomingWithinDays" src/App.tsx
          grep -F "rentOutstandingThroughCurrentMonth" src/App.tsx
      - name: Install
        run: npm ci
      - name: Self test
        run: npm run self-test
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Diff check
        run: git diff --check
      - name: Commit verified feature
        run: |
          rm scripts/apply-tenant-upcoming-month-pending.py .github/workflows/apply-tenant-upcoming-month-pending.yml
          git config user.name "pg95-bot"
          git config user.email "pg95-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add 5-day upcoming and month-end pending tenant filters"
            git push origin HEAD:feat/tenant-upcoming-month-pending
          fi
